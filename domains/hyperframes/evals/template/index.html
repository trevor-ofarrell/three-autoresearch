<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>HyperFrames AutoResearch Task</title>
    <style>
      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        width: 100%;
        height: 100%;
        background: #11161b;
        color: #f7fbff;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      [data-composition-id] {
        position: relative;
        width: 1280px;
        height: 720px;
        overflow: hidden;
        background:
          radial-gradient(circle at 16% 18%, rgba(76, 195, 255, 0.28), transparent 25%),
          linear-gradient(135deg, #11161b 0%, #1b2430 52%, #090d12 100%);
      }
      .clip { position: absolute; }
      .grid {
        inset: 0;
        background-image:
          linear-gradient(rgba(255,255,255,0.08) 1px, transparent 1px),
          linear-gradient(90deg, rgba(255,255,255,0.08) 1px, transparent 1px);
        background-size: 48px 48px;
        opacity: 0.38;
      }
      .title {
        left: 84px;
        top: 96px;
        width: 560px;
        z-index: 3;
      }
      .title h1 {
        margin: 0;
        font-size: 62px;
        line-height: 0.98;
        letter-spacing: 0;
      }
      .title p {
        margin: 22px 0 0;
        color: #c7d2dc;
        font-size: 24px;
        line-height: 1.35;
      }
      .task-surface {
        left: 680px;
        top: 166px;
        width: 460px;
        height: 300px;
        z-index: 4;
      }
      .surface-card {
        width: 460px;
        min-height: 300px;
        display: grid;
        align-content: center;
        gap: 12px;
        padding: 38px;
        background: rgba(246, 250, 255, 0.94);
        color: #111820;
        border: 1px solid rgba(255,255,255,0.32);
      }
      .surface-card h2 {
        margin: 0;
        font-size: 38px;
        line-height: 1;
        letter-spacing: 0;
      }
      .surface-card p {
        margin: 0;
        color: #31404b;
        font-size: 17px;
        line-height: 1.45;
      }
      .surface-card .eyebrow {
        color: #0f766e;
        font-size: 12px;
        font-weight: 760;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }
      .badge {
        left: 84px;
        bottom: 70px;
        padding: 12px 16px;
        border: 1px solid rgba(255,255,255,0.22);
        background: rgba(5, 8, 12, 0.56);
        color: #d7e2ea;
        font-size: 17px;
        z-index: 5;
      }
    </style>
  </head>
  <body>
    <div id="stage" data-composition-id="hf-autoresearch-task" data-start="0" data-duration="5" data-width="1280" data-height="720" data-fps="30">
      <div class="clip grid" data-start="0" data-duration="5" data-track-index="0"></div>
      <section class="clip title" data-start="0" data-duration="5" data-track-index="1">
        <h1>HyperFrames research scene</h1>
        <p>Neutral seek-driven composition ready for a task-specific canvas, GPU, or Skia implementation.</p>
      </section>
      <div id="task-surface" class="clip task-surface" data-start="1" data-duration="3" data-track-index="2">
        <article class="surface-card">
          <p class="eyebrow">Task surface</p>
          <h2>Implement here</h2>
          <p>Replace this neutral panel with the requested HyperFrames route and validator-visible fallback.</p>
        </article>
      </div>
      <div id="support-badge" class="clip badge" data-start="0" data-duration="5" data-track-index="3">HyperFrames: ready</div>
    </div>
    <script src="vendor/gsap/gsap.min.js"></script>
    <script>
      window.__playerReady = true;
      window.__renderReady = false;
      window.__timelines = window.__timelines || {};

      function renderFrame(seconds) {
        const time = Number.isFinite(Number(seconds)) ? Number(seconds) : 0;
        window.__hfCurrentTime = time;
        const badge = document.getElementById("support-badge");
        if (badge) badge.textContent = "Frame " + time.toFixed(2) + "s";
      }

      const timeline = window.gsap && window.gsap.timeline
        ? window.gsap.timeline({ paused: true, onUpdate: function () { renderFrame(timeline.time()); } })
        : null;
      if (timeline) {
        timeline.to("#support-badge", { opacity: 0.74, duration: 2.5 }).to("#support-badge", { opacity: 1, duration: 2.5 });
      }
      window.__timelines["hf-autoresearch-task"] = timeline || { seek: renderFrame };
      window.__renderFrame = renderFrame;
      window.addEventListener("hf-seek", function (event) {
        const detail = event && event.detail ? event.detail : {};
        renderFrame(detail.time || 0);
      });
      window.addEventListener("load", function () {
        renderFrame(0);
        window.__renderReady = true;
      });
    </script>
  </body>
</html>
