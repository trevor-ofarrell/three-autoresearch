# Qwen3.6-27B QLoRA smoke config.
# Intended for a cloud H100 CUDA environment, not local CPU/Mac execution.

base_model: Qwen/Qwen3.6-27B
trust_remote_code: true
strict: false
chat_template: tokenizer_default

datasets:
  - path: finetune/datasets-combined/sft/train.jsonl
    type: chat_template
    field_messages: messages
    roles_to_train:
      - assistant
    train_on_eos: turn

test_datasets:
  - path: finetune/datasets-combined/sft/valid.jsonl
    type: chat_template
    field_messages: messages
    roles_to_train:
      - assistant
    train_on_eos: turn

output_dir: /workspace/three-autoresearch-training/outputs/qwen36-smoke
dataset_prepared_path: /workspace/three-autoresearch-training/outputs/prepared/qwen36-smoke

sequence_len: 8192
sample_packing: false
eval_sample_packing: false
pad_to_sequence_len: true

load_in_4bit: true
adapter: qlora
bfloat16: true
bf16: true
tf32: true
flash_attention: true
gradient_checkpointing: true
gradient_checkpointing_kwargs:
  use_reentrant: false

bnb_config_kwargs:
  bnb_4bit_quant_type: nf4
  bnb_4bit_use_double_quant: true
  bnb_4bit_compute_dtype: bfloat16

lora_r: 16
lora_alpha: 32
lora_dropout: 0.0
lora_target_linear: true

micro_batch_size: 1
gradient_accumulation_steps: 4
num_epochs: 1
max_steps: 50
learning_rate: 0.0001
lr_scheduler: cosine
warmup_steps: 5
optimizer: adamw_torch_4bit

logging_steps: 1
eval_steps: 10
save_steps: 25
save_total_limit: 2

seed: 1337
