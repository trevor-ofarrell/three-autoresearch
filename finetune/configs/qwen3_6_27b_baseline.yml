# Qwen3.6-27B first serious QLoRA baseline.
# Uses only the clean combined SFT dataset generated by the local factories.

base_model: Qwen/Qwen3.6-27B
trust_remote_code: true
strict: false
chat_template: tokenizer_default

datasets:
  - path: finetune/datasets-combined/sft/train.jsonl
    type: chat_template
    field_messages: messages
    roles_to_train:
      - assistant
    train_on_eos: turn

test_datasets:
  - path: finetune/datasets-combined/sft/valid.jsonl
    type: chat_template
    field_messages: messages
    roles_to_train:
      - assistant
    train_on_eos: turn

output_dir: /workspace/three-autoresearch-training/outputs/qwen36-baseline
dataset_prepared_path: /workspace/three-autoresearch-training/outputs/prepared/qwen36-baseline

sequence_len: 8192
sample_packing: true
eval_sample_packing: false
pad_to_sequence_len: true

load_in_4bit: true
adapter: qlora
bfloat16: true
bf16: true
tf32: true
flash_attention: true
gradient_checkpointing: true
gradient_checkpointing_kwargs:
  use_reentrant: false

bnb_config_kwargs:
  bnb_4bit_quant_type: nf4
  bnb_4bit_use_double_quant: true
  bnb_4bit_compute_dtype: bfloat16

lora_r: 32
lora_alpha: 64
lora_dropout: 0.0
lora_target_linear: true

micro_batch_size: 1
gradient_accumulation_steps: 8
num_epochs: 1
learning_rate: 0.0001
lr_scheduler: cosine
warmup_ratio: 0.03
optimizer: adamw_torch_4bit

logging_steps: 5
eval_steps: 25
save_steps: 50
save_total_limit: 3

seed: 1337
